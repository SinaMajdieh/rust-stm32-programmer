[workspace]
members = [
    "backend",
    "cli",
    "firmware-targets",
    "generation",
    "ollama-client",
    "programmer-app",
    "studio-dioxus",
    "studio-gpui",
    "studio-ui", "studio-dioxus",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
license = "MIT OR Apache-2.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
rfd = "0.17"
strum = "0.27"
thiserror = "2"
tokio = "1"
toml = "0.9"

[workspace.dependencies.backend]
version = "0.1.0"
path = "backend"

[workspace.dependencies.firmware-targets]
version = "0.1.0"
path = "firmware-targets"

[workspace.dependencies.generation]
version = "0.1.0"
path = "generation"

[workspace.dependencies.ollama-client]
version = "0.1.0"
path = "ollama-client"

[workspace.dependencies.serde]
version = "1"
features = ["derive"]
