[workspace]
resolver = "3"
members = [
  "backend",
  "cli",
  "firmware-targets",
  "generation",
  "ollama-client",
  "studio-gpui",
  "studio-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
backend = { path = "backend", version = "0.1.0" }
firmware-targets = { path = "firmware-targets", version = "0.1.0" }
generation = { path = "generation", version = "0.1.0" }
ollama-client = { path = "ollama-client", version = "0.1.0" }

rfd = "0.17"
serde = { version = "1", features = ["derive"] }
strum = "0.27"
thiserror = "2"
tokio = "1"
toml = "0.9"
