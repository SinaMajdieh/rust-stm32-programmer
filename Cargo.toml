[workspace]
resolver = "3"
members = [
  "backend",
  "cli",
  "firmware-targets",
  "generation",
  "ollama-client",
  "studio-dioxus",
  "studio-gpui",
  "studio-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
rfd = "0.17"
strum = "0.27"
thiserror = "2"
tokio = "1"
toml = "0.9"
tw_merge = { version = "0.1.22", features = ["debug"] }
icons = { version = "0.19.0", features = ["dioxus"] }

[workspace.dependencies.backend]
path = "backend"
version = "0.1.0"

[workspace.dependencies.firmware-targets]
path = "firmware-targets"
version = "0.1.0"

[workspace.dependencies.generation]
path = "generation"
version = "0.1.0"

[workspace.dependencies.ollama-client]
path = "ollama-client"
version = "0.1.0"

[workspace.dependencies.serde]
version = "1"
features = ["derive"]
