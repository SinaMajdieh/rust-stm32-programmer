[package]
name = "firmware-targets"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"], optional = true }
include_dir = "0.7.4"
serde = { version = "1", features = ["derive"] }
strum = { version = "0.27", features = ["derive"] }
thiserror = "2.0.20"

[dev-dependencies]
tempfile = "3.27.0"

[features]
default = []
clap = ["dep:clap"]
