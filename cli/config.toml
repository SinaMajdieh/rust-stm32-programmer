[llm]
# Model used when --model is not provided.
selected_model = "ollama:qwen2.5-coder:7b"

# System prompt file used for generation.
system_prompt_path = "hal_prompt.txt"

# Models available to the generator.
available_models = [
  { name = "qwen3.5:4b", provider = "ollama" },
  { name = "qwen2.5-coder:3b", provider = "ollama" },
  { name = "deepseek-coder:6.7b-instruct", provider = "ollama" },
  { name = "codegemma:7b-instruct", provider = "ollama" },
  { name = "granite-code:8b-instruct", provider = "ollama" },
  { name = "qwen2.5-coder:7b-instruct", provider = "ollama" },
  { name = "qwen3.5:9b", provider = "ollama" },
  { name = "qwen2.5-coder:7b", provider = "ollama" },
  { name = "gpt-5.6-luna", provider = "openai" },
]

[llm.ollama]
[llm.ollama.client]
url = "http://localhost:11434"
keep_alive = "5m"
request_timeout = 120

[llm.ollama.generation]
temperature = 0.01
max_output_tokens = 4096
context_length = 32768
seed = 329

[llm.openai]
[llm.openai.client]
url = "https://api.gapgpt.app/v1"
api_key_env = "GAPGPT_API_KEY"
request_timeout = 120

[llm.openai.generation]
temperature = 0.2
top_p = 1.0
max_output_tokens = 4096
seed = 329
stream = false
